name: CI

on:
  push:
    branches:
      - main
      - develop
      - refactor-test 
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'demo/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # 一个失败不影响其他
      matrix:
        test_mode: [embedded, server, oceanbase]

    steps:
      - name: Free disk space
        uses: kfir4444/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install

      - name: Start OceanBase container
        if: matrix.test_mode == 'oceanbase'
        uses: oceanbase/setup-oceanbase-ce@v1
        with:
          image_name: 'oceanbase/oceanbase-ce'
          image_tag: '4.5.0.0-100000012025112711'
          mode: 'mini'
          sql_port: 10000
          datafile_size: '20G'
          log_disk_size: '10G'
          tenant_name: 'mysql'
          init_sql: "ALTER SYSTEM ob_vector_memory_limit_percentage = 30; create user 'jtuser'@'%'; GRANT SELECT, INSERT, UPDATE, DELETE ON test.* TO 'jtuser'@'%'; FLUSH PRIVILEGES;"

      - name: Start seekdb server container
        if: matrix.test_mode == 'server'
        run: |
          docker run --name seekdb-server -p 2881:2881 -d oceanbase/seekdb:latest
          sleep 15
          docker logs seekdb-server

      - name: Run tests for ${{ matrix.test_mode }}
        env:
          CI: 1
          SEEKDB_PATH: ${{ runner.temp }}/seekdb.db
          OB_PORT: 10000
          SERVER_PORT: 2881
        run: |
          # 只运行特定模式的测试
          poetry run pytest -v --log-cli-level=INFO -k "${{ matrix.test_mode }}" 
